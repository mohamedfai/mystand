<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFC Stand</title>
  <style>
    :root {
      --gold: #d4af37;
      --bg: #0c0c0c;
      --card-bg: #161616;
      --btn-bg: #1a1a1a;
      --border: #262626;
      --text: #ffffff;
      --text-muted: #888888;
      --green: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
    .container { width: 100%; max-width: 420px; padding-bottom: 25px; }
    .hidden { display: none !important; }

    /* Dashboard */
    .dash-header { text-align: center; margin-bottom: 20px; }
    .dash-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .dash-sub { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    .client-list { display: flex; flex-direction: column; gap: 8px; }
    .client-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border); padding: 10px 12px; border-radius: 12px; gap: 8px; }
    .client-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .client-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #444; }
    .dot.active { background: var(--green); box-shadow: 0 0 6px rgba(46, 204, 113, 0.4); }
    .client-status { font-size: 11px; color: var(--text-muted); }
    .row-actions { display: flex; align-items: center; gap: 5px; }
    .btn-action { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 6px 10px; border-radius: 8px; font-size: 11px; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .btn-qr { background: #222; border: 1px solid #444; color: #fff; padding: 6px 8px; border-radius: 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-qr:hover { border-color: var(--gold); color: var(--gold); }

    /* QR Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
    .modal-box { background: #161616; border: 1px solid var(--gold); border-radius: 20px; padding: 24px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal-title { font-size: 16px; font-weight: bold; color: var(--gold); margin-bottom: 12px; }
    .qr-img { width: 180px; height: 180px; border-radius: 12px; background: #fff; padding: 10px; margin: 0 auto 16px auto; display: block; }
    .btn-download-qr { width: 100%; background: var(--gold); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
    .btn-close-qr { width: 100%; background: #262626; color: #aaa; border: none; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer; }

    /* Profile UI */
    .cover { width: 100%; height: 140px; background: #1c1c1c; border-radius: 16px 16px 0 0; background-size: cover; background-position: center; }
    .avatar-wrap { display: flex; justify-content: center; margin-top: -55px; }
    .avatar { width: 110px; height: 110px; border-radius: 24px; border: 2.5px solid var(--gold); background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--gold); object-fit: cover; }
    .meta { text-align: center; margin: 12px 0 20px 0; }
    .tag { display: inline-block; background: rgba(212,175,55,0.15); border: 1px solid var(--gold); color: var(--gold); font-size: 11px; padding: 3px 12px; border-radius: 12px; margin-bottom: 8px; font-weight: 600; }
    .name { font-size: 22px; font-weight: 800; color: #fff; }
    .desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; padding: 0 10px; }

    /* Profile Actions */
    .btn-vcard { width: 100%; background: var(--gold); color: #000; border: none; padding: 13px; border-radius: 14px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .btn-box { display: flex; align-items: center; gap: 12px; background: var(--btn-bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; text-decoration: none; color: #fff; transition: 0.15s; }
    .btn-box:active { transform: scale(0.97); }
    .btn-box.full { width: 100%; margin-bottom: 10px; }
    .btn-icon { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .btn-icon svg { width: 22px; height: 22px; fill: currentColor; }
    .btn-txt h4 { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .btn-txt p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Form UI */
    .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
    .form-title { font-size: 18px; font-weight: 700; color: var(--gold); text-align: center; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .group-header label { font-size: 11px; color: var(--text-muted); }
    .btn-add { background: #262626; border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; font-weight: bold; }
    .inputs-wrapper { display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    .input-row input { flex: 1; padding: 10px 12px; background: #0c0c0c; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 13px; outline: none; }
    .input-row input:focus { border-color: var(--gold); }
    .btn-remove { background: #2a1515; border: 1px solid #e74c3c; color: #e74c3c; width: 34px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .file-input { width: 100%; padding: 8px; background: #0c0c0c; border: 1px dashed var(--border); border-radius: 10px; color: var(--text-muted); font-size: 12px; }
    
    .form-actions { display: flex; gap: 8px; margin-top: 18px; }
    .btn-submit { flex: 1; background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-cancel { background: #222; color: #fff; border: 1px solid var(--border); padding: 12px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; }
    .loader { text-align: center; padding-top: 80px; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <div id="loader" class="loader">Chargement...</div>

  <!-- Dashboard 50 Stands -->
  <section id="dashboard" class="hidden">
    <div class="dash-header">
      <h1 class="dash-title">Tableau de Bord — 50 Stands</h1>
      <p class="dash-sub">Chaque stand possède son lien unique NFC / QR Code.<br>Point Vert = Configuré | Gris = Non configuré</p>
    </div>
    <div class="client-list" id="clientsContainer"></div>
  </section>

  <!-- Profile View -->
  <section id="profileView" class="hidden">
    <div id="viewCover" class="cover"></div>
    <div class="avatar-wrap">
      <img id="viewAvatarImg" class="avatar hidden" alt="Logo">
      <div id="viewAvatarPlaceholder" class="avatar">🏪</div>
    </div>
    <div class="meta">
      <div id="viewBadge" class="tag hidden"></div>
      <h2 id="viewName" class="name">Mohamed Faiz</h2>
      <p id="viewDesc" class="desc"></p>
    </div>

    <!-- Enregistrer le contact -->
    <button id="btnSaveVcard" class="btn-vcard">
      💾 Enregistrer le contact
    </button>

    <!-- Contact Grid -->
    <div id="contactGrid" class="grid"></div>
    <div id="socialGrid" class="grid"></div>
    <div id="tiktokContainer"></div>
    <div id="websiteContainer"></div>
    <div id="mapsContainer"></div>

    <!-- Google Review -->
    <a id="btnReview" href="#" target="_blank" class="btn-box full hidden" style="border-color: rgba(251,188,4,0.4); background: rgba(251,188,4,0.06);">
      <div class="btn-icon" style="color:#FBBC04;">
        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </div>
      <div class="btn-txt">
        <h4>Avis Google</h4>
        <p>Laissez-nous 5 étoiles ⭐</p>
      </div>
    </a>
  </section>

  <!-- Form Section -->
  <section id="editFormSection" class="hidden">
    <div class="form-card">
      <h2 class="form-title">Configuration du Stand (<span id="formClientId"></span>)</h2>
      <form id="standForm">
        <div class="form-group">
          <div class="group-header"><label>Nom de l'entreprise ou personne *</label></div>
          <div class="input-row"><input type="text" id="inName" required placeholder="Ex: Mohamed Faiz"></div>
        </div>
        <div class="form-group">
          <div class="group-header"><label>Badge / Type d'activité</label></div>
          <div class="input-row"><input type="text" id="inActivity" placeholder="Ex: Boutique, Café, Barber..."></div>
        </div>
        <div class="form-group">
          <div class="group-header"><label>Description courte</label></div>
          <div class="input-row"><input type="text" id="inDesc" placeholder="Ex: Bienvenue dans notre boutique"></div>
        </div>

        <div class="form-group">
          <div class="group-header">
            <label>Téléphone(s)</label>
            <button type="button" class="btn-add" onclick="addField('wrapPhones', 'tel', '0600000000')">+ Ajouter</button>
          </div>
          <div id="wrapPhones" class="inputs-wrapper"></div>
        </div>

        <div class="form-group">
          <div class="group-header">
            <label>WhatsApp(s) (avec indicatif)</label>
            <button type="button" class="btn-add" onclick="addField('wrapWhatsapps', 'tel', '212600000000')">+ Ajouter</button>
          </div>
          <div id="wrapWhatsapps" class="inputs-wrapper"></div>
        </div>

        <div class="form-group">
          <div class="group-header">
            <label>Instagram(s)</label>
            <button type="button" class="btn-add" onclick="addField('wrapInstas', 'url', 'https://instagram.com/...')">+ Ajouter</button>
          </div>
          <div id="wrapInstas" class="inputs-wrapper"></div>
        </div>

        <div class="form-group">
          <div class="group-header">
            <label>Facebook(s)</label>
            <button type="button" class="btn-add" onclick="addField('wrapFbs', 'url', 'https://facebook.com/...')">+ Ajouter</button>
          </div>
          <div id="wrapFbs" class="inputs-wrapper"></div>
        </div>

        <div class="form-group">
          <div class="group-header">
            <label>TikTok(s)</label>
            <button type="button" class="btn-add" onclick="addField('wrapTiktoks', 'url', 'https://tiktok.com/@...')">+ Ajouter</button>
          </div>
          <div id="wrapTiktoks" class="inputs-wrapper"></div>
        </div>

        <div class="form-group">
          <div class="group-header">
            <label>Site Web</label>
            <button type="button" class="btn-add" onclick="addField('wrapWebsites', 'url', 'https://mon-site.com')">+ Ajouter</button>
          </div>
          <div id="wrapWebsites" class="inputs-wrapper"></div>
        </div>

        <div class="form-group">
          <div class="group-header">
            <label>Google Maps</label>
            <button type="button" class="btn-add" onclick="addField('wrapMaps', 'url', 'https://maps.app.goo.gl/...')">+ Ajouter</button>
          </div>
          <div id="wrapMaps" class="inputs-wrapper"></div>
        </div>

        <div class="form-group">
          <div class="group-header"><label>Lien Avis Google (Google Review)</label></div>
          <div class="input-row"><input type="url" id="inReview" placeholder="https://g.page/r/..."></div>
        </div>

        <div class="form-group">
          <div class="group-header"><label>Photo de Profil / Logo</label></div>
          <input type="file" id="fileLogo" class="file-input" accept="image/*">
        </div>

        <div class="form-group">
          <div class="group-header"><label>Photo de Couverture</label></div>
          <input type="file" id="fileCover" class="file-input" accept="image/*">
        </div>

        <div class="form-actions">
          <button type="submit" id="btnSaveSubmit" class="btn-submit">Enregistrer</button>
          <button type="button" id="btnCancelEdit" class="btn-cancel">Annuler</button>
        </div>
      </form>
    </div>
  </section>
</div>

<!-- Modal QR Code -->
<div id="qrModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="qrModalTitle" class="modal-title">QR Code Stand</h3>
    <img id="qrModalImg" class="qr-img" src="" alt="QR Code">
    <button id="btnDownloadQr" class="btn-download-qr">📥 Télécharger l'image QR</button>
    <button id="btnCloseQr" class="btn-close-qr">Fermer</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDVwTZVjpTeFC7M9V0rZacSYxSDffAXnMw",
    authDomain: "cartes-clients-aa64f.firebaseapp.com",
    projectId: "cartes-clients-aa64f",
    storageBucket: "cartes-clients-aa64f.firebasestorage.app",
    messagingSenderId: "469049575960",
    appId: "1:469049575960:web:0d7a9f1b96ba98383f916d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('id');
  const isEditParam = params.get('edit') === 'true';

  let currentData = {};
  let base64Logo = "";
  let base64Cover = "";

  window.addField = function(wrapperId, type, placeholder, value = '') {
    const wrap = document.getElementById(wrapperId);
    const row = document.createElement('div');
    row.className = 'input-row';
    row.innerHTML = `
      <input type="${type}" placeholder="${placeholder}" value="${value}">
      <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
    `;
    wrap.appendChild(row);
  };

  function getFieldValues(wrapperId) {
    const inputs = document.querySelectorAll(`#${wrapperId} input`);
    const vals = [];
    inputs.forEach(inp => { if (inp.value.trim()) vals.push(inp.value.trim()); });
    return vals;
  }

  function setFieldValues(wrapperId, type, placeholder, array) {
    const wrap = document.getElementById(wrapperId);
    wrap.innerHTML = '';
    if (array && array.length > 0) {
      array.forEach(val => window.addField(wrapperId, type, placeholder, val));
    } else {
      window.addField(wrapperId, type, placeholder, '');
    }
  }

  async function init() {
    if (!clientId) {
      show('dashboard');
      renderDashboard();
      return;
    }

    await loadData(clientId);

    if (isEditParam) {
      showEdit();
    } else {
      renderProfile();
      show('profileView');
    }
  }

  function show(id) {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('profileView').classList.add('hidden');
    document.getElementById('editFormSection').classList.add('hidden');
    document.getElementById(id).classList.remove('hidden');
  }

  function renderDashboard() {
    const list = document.getElementById('clientsContainer');
    list.innerHTML = '';
    const origin = window.location.origin + window.location.pathname;

    for (let i = 1; i <= 50; i++) {
      const cId = 'client' + String(i).padStart(2, '0');
      const row = document.createElement('div');
      row.className = 'client-row';
      const cardUrl = `${origin}?id=${cId}`;
      const editUrl = `${origin}?id=${cId}&edit=true`;

      row.innerHTML = `
        <div class="client-info">
          <span class="client-title"><span class="dot" id="dot-${cId}"></span> ${cId}</span>
          <span class="client-status" id="status-${cId}">Chargement...</span>
        </div>
        <div class="row-actions">
          <button type="button" class="btn-qr" title="Voir QR Code" onclick="openQrModal('${cId}', '${cardUrl}')">▦ QR</button>
          <a class="btn-action" href="${cardUrl}">البطاقة</a>
          <a class="btn-action" href="${editUrl}">إعداد ←</a>
        </div>
      `;
      list.appendChild(row);

      getDoc(doc(db, "clients", cId)).then(snap => {
        const dot = document.getElementById(`dot-${cId}`);
        const status = document.getElementById(`status-${cId}`);
        if (snap.exists() && snap.data().name) {
          dot.classList.add('active');
          status.textContent = snap.data().name;
          status.style.color = 'var(--gold)';
        } else {
          status.textContent = 'مازال ماعمرش';
        }
      });
    }
  }

  window.openQrModal = function(id, url) {
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
    document.getElementById('qrModalTitle').textContent = `QR Code — ${id}`;
    document.getElementById('qrModalImg').src = qrUrl;

    document.getElementById('btnDownloadQr').onclick = async () => {
      try {
        const res = await fetch(qrUrl);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `QR_${id}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch(e) {
        window.open(qrUrl, '_blank');
      }
    };
    document.getElementById('qrModal').classList.remove('hidden');
  };

  document.getElementById('btnCloseQr').addEventListener('click', () => {
    document.getElementById('qrModal').classList.add('hidden');
  });

  async function loadData(id) {
    try {
      const snap = await getDoc(doc(db, "clients", id));
      if (snap.exists()) currentData = snap.data();
    } catch(e) { console.error(e); }
  }

  function renderProfile() {
    const d = currentData || {};
    document.getElementById('viewName').textContent = d.name || 'Stand NFC';
    document.getElementById('viewDesc').textContent = d.desc || '';

    const badge = document.getElementById('viewBadge');
    if (d.activity) {
      badge.textContent = d.activity;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    if (d.logo) {
      const img = document.getElementById('viewAvatarImg');
      img.src = d.logo;
      img.classList.remove('hidden');
      document.getElementById('viewAvatarPlaceholder').classList.add('hidden');
    }

    if (d.cover) {
      document.getElementById('viewCover').style.backgroundImage = `url(${d.cover})`;
    }

    // Grid Contacts
    const cGrid = document.getElementById('contactGrid');
    cGrid.innerHTML = '';
    const phones = Array.isArray(d.phones) ? d.phones : (d.phone ? [d.phone] : []);
    const whatsapps = Array.isArray(d.whatsapps) ? d.whatsapps : (d.whatsapp ? [d.whatsapp] : []);
    
    phones.forEach((p, idx) => {
      cGrid.innerHTML += `
        <a href="tel:${p}" class="btn-box">
          <div class="btn-icon" style="color:#2ecc71;"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24 11.72 11.72 0 003.68.59 1 1 0 011 1v3.5a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.25 1.02l-2.22 2.09z"/></svg></div>
          <div class="btn-txt"><h4>Appeler ${phones.length > 1 ? (idx + 1) : ''}</h4><p>${p}</p></div>
        </a>
      `;
    });

    whatsapps.forEach((w, idx) => {
      cGrid.innerHTML += `
        <a href="https://wa.me/${w}" target="_blank" class="btn-box">
          <div class="btn-icon" style="color:#25D366;"><svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm5.8 14.12c-.24.68-1.2 1.25-1.66 1.33-.44.08-1.01.12-3.26-.81-2.88-1.19-4.73-4.14-4.88-4.33-.14-.2-1.17-1.56-1.17-2.98 0-1.41.74-2.11 1-2.4.26-.29.58-.36.77-.36.19 0 .39.01.55.02.18.01.42-.07.66.5.24.58.82 2 .89 2.15.07.15.12.33.02.53-.1.2-.15.32-.3.49-.15.18-.31.4-.45.54-.15.15-.3.32-.13.62.17.29.77 1.27 1.65 2.05 1.13 1.01 2.09 1.32 2.38 1.47.3.15.47.12.64-.07.18-.2.77-.89.97-1.2.2-.31.41-.26.68-.15.28.11 1.75.82 2.05.97.3.15.5.22.58.34.07.13.07.74-.17 1.42z"/></svg></div>
          <div class="btn-txt"><h4>WhatsApp ${whatsapps.length > 1 ? (idx + 1) : ''}</h4><p>Discuter</p></div>
        </a>
      `;
    });

    // Socials
    const sGrid = document.getElementById('socialGrid');
    sGrid.innerHTML = '';
    const instas = Array.isArray(d.instas) ? d.instas : (d.instagram ? [d.instagram] : []);
    const fbs = Array.isArray(d.fbs) ? d.fbs : (d.facebook ? [d.facebook] : []);

    instas.forEach((ins, idx) => {
      sGrid.innerHTML += `
        <a href="${ins}" target="_blank" class="btn-box">

        <a href="${f}" target="_blank" class="btn-box">
          <div class="btn-icon" style="color:#1877F2;"><svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></div>
          <div class="btn-txt"><h4>Facebook ${fbs.length > 1 ? (idx + 1) : ''}</h4><p>Page</p></div>
        </a>
      `;
    });

    // TikTok
    const tkWrap = document.getElementById('tiktokContainer');
    tkWrap.innerHTML = '';
    const tiktoks = Array.isArray(d.tiktoks) ? d.tiktoks : (d.tiktok ? [d.tiktok] : []);
    tiktoks.forEach((tk, idx) => {
      tkWrap.innerHTML += `
        <a href="${tk}" target="_blank" class="btn-box full">
          <div class="btn-icon" style="color:#fff;"><svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.24 1.07-.14 1.61.24 1.64 1.82 2.89 3.46 2.71 1.07-.06 2.07-.64 2.62-1.57.43-.69.63-1.5.62-2.31.05-4.88.01-9.76.02-14.64z"/></svg></div>
          <div class="btn-txt"><h4>TikTok ${tiktoks.length > 1 ? (idx + 1) : ''}</h4><p>Vidéos</p></div>
        </a>
      `;
    });

    // Site Web
    const webWrap = document.getElementById('websiteContainer');
    webWrap.innerHTML = '';
    const websites = Array.isArray(d.websites) ? d.websites : (d.website ? [d.website] : []);
    websites.forEach((web, idx) => {
      webWrap.innerHTML += `
        <a href="${web}" target="_blank" class="btn-box full">
          <div class="btn-icon" style="color:var(--gold);"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
          <div class="btn-txt"><h4>Site Web ${websites.length > 1 ? (idx + 1) : ''}</h4><p>Visiter notre site</p></div>
        </a>
      `;
    });

    // Google Maps
    const mapsWrap = document.getElementById('mapsContainer');
    mapsWrap.innerHTML = '';
    const maps = Array.isArray(d.mapsList) ? d.mapsList : (d.maps ? [d.maps] : []);
    maps.forEach((m, idx) => {
      mapsWrap.innerHTML += `
        <a href="${m}" target="_blank" class="btn-box full">
          <div class="btn-icon" style="color:#EA4335;"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg></div>
          <div class="btn-txt"><h4>Google Maps ${maps.length > 1 ? (idx + 1) : ''}</h4><p>Itinéraire</p></div>
        </a>
      `;

    // Google Review
    const btnRev = document.getElementById('btnReview');
    if (d.review) {
      btnRev.href = d.review;
      btnRev.classList.remove('hidden');
    } else {
      btnRev.classList.add('hidden');
    }
  }

  function showEdit() {
    document.getElementById('formClientId').textContent = clientId;
    const d = currentData || {};
    document.getElementById('inName').value = d.name || '';
    document.getElementById('inActivity').value = d.activity || '';
    document.getElementById('inDesc').value = d.desc || '';
    document.getElementById('inReview').value = d.review || '';

    setFieldValues('wrapPhones', 'tel', '0600000000', Array.isArray(d.phones) ? d.phones : (d.phone ? [d.phone] : []));
    setFieldValues('wrapWhatsapps', 'tel', '212600000000', Array.isArray(d.whatsapps) ? d.whatsapps : (d.whatsapp ? [d.whatsapp] : []));
    setFieldValues('wrapInstas', 'url', 'https://instagram.com/...', Array.isArray(d.instas) ? d.instas : (d.instagram ? [d.instagram] : []));
    setFieldValues('wrapFbs', 'url', 'https://facebook.com/...', Array.isArray(d.fbs) ? d.fbs : (d.facebook ? [d.facebook] : []));
    setFieldValues('wrapTiktoks', 'url', 'https://tiktok.com/@...', Array.isArray(d.tiktoks) ? d.tiktoks : (d.tiktok ? [d.tiktok] : []));
    setFieldValues('wrapWebsites', 'url', 'https://mon-site.com', Array.isArray(d.websites) ? d.websites : (d.website ? [d.website] : []));
    setFieldValues('wrapMaps', 'url', 'https://maps.app.goo.gl/...', Array.isArray(d.mapsList) ? d.mapsList : (d.maps ? [d.maps] : []));

    base64Logo = d.logo || "";
    base64Cover = d.cover || "";
    show('editFormSection');
  }

  function readFileAsBase64(file, maxW, maxH) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > maxW || h > maxH) {
            const ratio = Math.min(maxW / w, maxH / h);
            w *= ratio;
            h *= ratio;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('fileLogo').addEventListener('change', async (e) => {
    if (e.target.files[0]) base64Logo = await readFileAsBase64(e.target.files[0], 200, 200);
  });

  document.getElementById('fileCover').addEventListener('change', async (e) => {
    if (e.target.files[0]) base64Cover = await readFileAsBase64(e.target.files[0], 500, 250);
  });

  document.getElementById('btnCancelEdit').addEventListener('click', () => {
    window.location.href = window.location.pathname + '?id=' + clientId;
  });

  document.getElementById('standForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSaveSubmit');
    btn.textContent = 'Enregistrement...';
    btn.disabled = true;

    const data = {
      name: document.getElementById('inName').value,
      activity: document.getElementById('inActivity').value,
      desc: document.getElementById('inDesc').value,
      review: document.getElementById('inReview').value,
      phones: getFieldValues('wrapPhones'),
      whatsapps: getFieldValues('wrapWhatsapps'),
      instas: getFieldValues('wrapInstas'),
      fbs: getFieldValues('wrapFbs'),
      tiktoks: getFieldValues('wrapTiktoks'),
      websites: getFieldValues('wrapWebsites'),
      mapsList: getFieldValues('wrapMaps'),
      logo: base64Logo,
      cover: base64Cover
    };

    try {
      await setDoc(doc(db, "clients", clientId), data);
      window.location.href = window.location.pathname + '?id=' + clientId;
    } catch (err) {
      alert("Erreur: " + err.message);
      btn.textContent = 'Enregistrer';
      btn.disabled = false;
    }
  });

  // توليد vCard متطابق بدقة مع حقول iOS (إضافة رابط وصفحات شخصية)
  document.getElementById('btnSaveVcard').addEventListener('click', () => {
    const d = currentData || {};
    const fullName = (d.name || 'Client').trim();
    const nameParts = fullName.split(' ');
    const firstName = nameParts[0] || '';
    const lastName = nameParts.slice(1).join(' ') || '';

    const phones = Array.isArray(d.phones) && d.phones.length > 0 ? d.phones : (d.phone ? [d.phone] : []);
    const whatsapps = Array.isArray(d.whatsapps) && d.whatsapps.length > 0 ? d.whatsapps : (d.whatsapp ? [d.whatsapp] : []);
    const websites = Array.isArray(d.websites) && d.websites.length > 0 ? d.websites : (d.website ? [d.website] : []);
    const instas = Array.isArray(d.instas) && d.instas.length > 0 ? d.instas : (d.instagram ? [d.instagram] : []);
    const fbs = Array.isArray(d.fbs) && d.fbs.length > 0 ? d.fbs : (d.facebook ? [d.facebook] : []);
    const tiktoks = Array.isArray(d.tiktoks) && d.tiktoks.length > 0 ? d.tiktoks : (d.tiktok ? [d.tiktok] : []);
    const maps = Array.isArray(d.mapsList) && d.mapsList.length > 0 ? d.mapsList : (d.maps ? [d.maps] : []);

    let lines = [];
    lines.push("BEGIN:VCARD");
    lines.push("VERSION:3.0");
    lines.push(`N:${lastName};${firstName};;;`);
    lines.push(`FN:${fullName}`);

    if (d.activity) {
      lines.push(`ORG:${d.activity}`);
      lines.push(`TITLE:${d.activity}`);
    }

    // الهواتف
    phones.forEach(p => {
      lines.push(`TEL;TYPE=CELL,VOICE:${p}`);
    });
    whatsapps.forEach(w => {
      if (!phones.includes(w)) {
        lines.push(`TEL;TYPE=WHATSAPP,VOICE:${w}`);
      }
    });

    let itemIndex = 1;

    // الصفحات الشخصية (Social Profiles) في الآيفون
    instas.forEach((ins, i) => {
      lines.push(`item${itemIndex}.URL:${ins}`);
      lines.push(`item${itemIndex}.X-ABLabel:Instagram ${instas.length > 1 ? (i + 1) : ''}`);
      lines.push(`X-SOCIALPROFILE;type=instagram:${ins}`);
      itemIndex++;
    });

    fbs.forEach((f, i) => {
      lines.push(`item${itemIndex}.URL:${f}`);
      lines.push(`item${itemIndex}.X-ABLabel:Facebook ${fbs.length > 1 ? (i + 1) : ''}`);
      lines.push(`X-SOCIALPROFILE;type=facebook:${f}`);
      itemIndex++;
    });

    tiktoks.forEach((tk, i) => {
      lines.push(`item${itemIndex}.URL:${tk}`);
      lines.push(`item${itemIndex}.X-ABLabel:TikTok ${tiktoks.length > 1 ? (i + 1) : ''}`);
      lines.push(`X-SOCIALPROFILE;type=tiktok:${tk}`);
      itemIndex++;
    });

    // خانات الروابط المخصصة في الآيفون (إضافة رابط)
    websites.forEach((w, i) => {
      lines.push(`item${itemIndex}.URL:${w}`);
      lines.push(`item${itemIndex}.X-ABLabel:Site Web ${websites.length > 1 ? (i + 1) : ''}`);
      itemIndex++;
    });

    maps.forEach((m, i) => {
      lines.push(`item${itemIndex}.URL:${m}`);
      lines.push(`item${itemIndex}.X-ABLabel:Google Maps ${maps.length > 1 ? (i + 1) : ''}`);
      itemIndex++;
    });

    if (d.review) {
      lines.push(`item${itemIndex}.URL:${d.review}`);
      lines.push(`item${itemIndex}.X-ABLabel:Avis Google`);
      itemIndex++;
    }

    // صورة الشعار / البروفايل للآيفون
    if (d.logo && d.logo.includes(',')) {
      const b64 = d.logo.split(',')[1].replace(/[\r\n\s]/g, '');
      const chunks = b64.match(/.{1,72}/g);
      if (chunks && chunks.length > 0) {
        lines.push(`PHOTO;TYPE=JPEG;ENCODING=BASE64:`);
        chunks.forEach(chunk => {
          lines.push(` ${chunk}`);
        });
      }
    }

    lines.push("END:VCARD");

    const vcfContent = lines.join("\r\n");
    const blob = new Blob([vcfContent], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${fullName}.vcf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  init();
</script>
