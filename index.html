<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة الزبون الذكية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="loading" class="text-center">
    <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent mb-3"></div>
    <p class="text-slate-400 text-sm">جاري تحميل البيانات...</p>
  </div>

  <main id="app" class="w-full max-w-md hidden fade-in">
    <!-- View Mode -->
    <div id="viewMode" class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl text-center relative overflow-hidden">
      <div class="w-24 h-24 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-full mx-auto flex items-center justify-center shadow-lg shadow-emerald-500/20 mb-4">
        <i class="fa-solid fa-store text-3xl text-slate-950"></i>
      </div>
      <h1 id="viewName" class="text-2xl font-bold text-white mb-1">اسم المحل</h1>
      <p id="viewDesc" class="text-slate-400 text-sm mb-6">وصف النشاط التجاري</p>

      <div class="space-y-3" id="linksContainer">
        <a id="btnPhone" href="#" class="flex items-center justify-between p-3.5 bg-slate-700/50 hover:bg-slate-700 rounded-xl transition border border-slate-600/40">
          <span class="flex items-center gap-3"><i class="fa-solid fa-phone text-emerald-400"></i> اتصال هاتفياً</span>
          <i class="fa-solid fa-chevron-left text-xs text-slate-500"></i>
        </a>
        <a id="btnWhatsapp" href="#" target="_blank" class="flex items-center justify-between p-3.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 rounded-xl transition border border-emerald-500/30">
          <span class="flex items-center gap-3"><i class="fa-brands fa-whatsapp text-lg"></i> محادثة واتساب</span>
          <i class="fa-solid fa-chevron-left text-xs text-emerald-400/50"></i>
        </a>
        <a id="btnMaps" href="#" target="_blank" class="flex items-center justify-between p-3.5 bg-slate-700/50 hover:bg-slate-700 rounded-xl transition border border-slate-600/40">
          <span class="flex items-center gap-3"><i class="fa-solid fa-location-dot text-rose-400"></i> الموقع على الخريطة</span>
          <i class="fa-solid fa-chevron-left text-xs text-slate-500"></i>
        </a>
        <a id="btnInsta" href="#" target="_blank" class="flex items-center justify-between p-3.5 bg-slate-700/50 hover:bg-slate-700 rounded-xl transition border border-slate-600/40">
          <span class="flex items-center gap-3"><i class="fa-brands fa-instagram text-pink-400"></i> متابعة على إنستغرام</span>
          <i class="fa-solid fa-chevron-left text-xs text-slate-500"></i>
        </a>
      </div>

      <button id="btnOpenEdit" class="mt-8 text-xs text-slate-500 hover:text-slate-300 transition flex items-center gap-1.5 mx-auto">
        <i class="fa-solid fa-gear"></i> تعديل بيانات البطاقة
      </button>
    </div>

    <!-- Edit Mode -->
    <div id="editMode" class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl hidden">
      <h2 class="text-xl font-bold text-white mb-4 text-center">تعديل بيانات <span id="clientBadge" class="text-emerald-400"></span></h2>
      <form id="editForm" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">اسم المحل أو النشاط</label>
          <input type="text" id="inputName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">وصف مختصر</label>
          <input type="text" id="inputDesc" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">رقم الهاتف</label>
          <input type="tel" id="inputPhone" placeholder="0600000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">رقم الواتساب (مع رمز الدولة)</label>
          <input type="tel" id="inputWhatsapp" placeholder="212600000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">رابط Google Maps</label>
          <input type="url" id="inputMaps" placeholder="https://maps.google.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">رابط حساب إنستغرام</label>
          <input type="url" id="inputInsta" placeholder="https://instagram.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" id="btnSave" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition text-sm">حفظ التغييرات</button>
          <button type="button" id="btnCancelEdit" class="px-4 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl transition text-sm">إلغاء</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDVwTZVjpTeFC7M9V0rZacSYxSDffAXnMw",
      authDomain: "cartes-clients-aa64f.firebaseapp.com",
      projectId: "cartes-clients-aa64f",
      storageBucket: "cartes-clients-aa64f.firebasestorage.app",
      messagingSenderId: "469049575960",
      appId: "1:469049575960:web:0d7a9f1b96ba98383f916d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id') || 'client01';

    const defaultData = {
      name: "اسم المحل الافتراضي",
      desc: "مرحباً بكم، اضغط على الروابط للتواصل معنا",
      phone: "",
      whatsapp: "",
      maps: "",
      instagram: ""
    };

    let currentData = { ...defaultData };
    const docRef = doc(db, "clients", clientId);

    async function loadData() {
      try {
        const snap = await getDoc(docRef);
        if (snap.exists()) {
          currentData = snap.data();
        } else {
          await setDoc(docRef, defaultData);
        }
        renderView();
      } catch (err) {
        console.error("خطأ في جلب البيانات:", err);
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      }
    }

    function renderView() {
      document.getElementById('viewName').textContent = currentData.name || "اسم المحل";
      document.getElementById('viewDesc').textContent = currentData.desc || "";

      setupBtn('btnPhone', currentData.phone ? `tel:${currentData.phone}` : null);
      setupBtn('btnWhatsapp', currentData.whatsapp ? `https://wa.me/${currentData.whatsapp}` : null);
      setupBtn('btnMaps', currentData.maps || null);
      setupBtn('btnInsta', currentData.instagram || null);
    }

    function setupBtn(id, href) {
      const el = document.getElementById(id);
      if (href) {
        el.href = href;
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    document.getElementById('btnOpenEdit').addEventListener('click', () => {
      document.getElementById('clientBadge').textContent = clientId;
      document.getElementById('inputName').value = currentData.name || '';
      document.getElementById('inputDesc').value = currentData.desc || '';
      document.getElementById('inputPhone').value = currentData.phone || '';
      document.getElementById('inputWhatsapp').value = currentData.whatsapp || '';
      document.getElementById('inputMaps').value = currentData.maps || '';
      document.getElementById('inputInsta').value = currentData.instagram || '';

      document.getElementById('viewMode').classList.add('hidden');
      document.getElementById('editMode').classList.remove('hidden');
    });

    document.getElementById('btnCancelEdit').addEventListener('click', () => {
      document.getElementById('editMode').classList.add('hidden');
      document.getElementById('viewMode').classList.remove('hidden');
    });

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('btnSave');
      saveBtn.disabled = true;
      saveBtn.textContent = 'جاري الحفظ...';

      const updated = {
        name: document.getElementById('inputName').value,
        desc: document.getElementById('inputDesc').value,
        phone: document.getElementById('inputPhone').value,
        whatsapp: document.getElementById('inputWhatsapp').value,
        maps: document.getElementById('inputMaps').value,
        instagram: document.getElementById('inputInsta').value,
      };

      try {
        await setDoc(docRef, updated);
        currentData = updated;
        renderView();
        document.getElementById('editMode').classList.add('hidden');
        document.getElementById('viewMode').classList.remove('hidden');
      } catch (err) {
        alert("فشل الحفظ: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ التغييرات';
      }
    });

    loadData();
  </script>
</body>
</html>
